<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Star Arcade</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#182B39;--card:#21384A;--bd:#2D4A60;--gold:#FFB800;--cy:#2AABEE;--g:#2ECC71;--r:#E74C3C;--mut:#8FA8BC;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#0b141c;font:500 14px/1.4 Inter,system-ui,sans-serif;color:#fff;display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100%;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 60px #000a;padding-top:env(safe-area-inset-top,0px)}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--bd)}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#2AABEE,#1b6fa0);display:grid;place-items:center;font-weight:800}
.av.big{width:64px;height:64px;font-size:26px}.av{overflow:hidden}
.un{flex:1;font-weight:700}.un small{display:block;color:var(--mut);font-weight:500;font-size:11px}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:6px 12px;font-weight:800;color:#FFD700}
.st{width:1.1em;height:1.1em;vertical-align:-.18em;flex:none;filter:drop-shadow(0 1px 2px #0006)}
main{flex:1;overflow-y:auto;padding:14px}
nav{display:flex;background:#132330;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:9px 0 8px;font:700 11px Inter,sans-serif;cursor:pointer;display:grid;gap:2px;min-height:52px;transition:color .2s}
nav button span{font-size:20px}nav button.on{color:var(--cy)}
h2{font-size:18px;font-weight:800;margin:2px 0 12px}h3{font-size:14px;font-weight:700;margin:14px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;box-shadow:0 6px 16px #0004;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lob{cursor:pointer;text-align:center;transition:transform .15s,border-color .15s;margin:0}.lob:hover{transform:translateY(-3px);border-color:var(--cy)}.lob b{display:block;font-size:34px}.lob small{color:var(--mut)}
.mut{color:var(--mut);font-size:12px}
button.b{background:linear-gradient(180deg,#FFD700,#FFB800);color:#3a2600;border:0;border-radius:11px;padding:12px 16px;font:800 14px Inter,sans-serif;cursor:pointer;min-height:44px;transition:transform .1s,filter .2s}
button.b:hover{filter:brightness(1.08)}button.b:active{transform:scale(.97)}button.b:disabled{opacity:.4;cursor:not-allowed}
button.b.cy{background:linear-gradient(180deg,#4cc0fb,#2AABEE);color:#fff}button.b.gr{background:linear-gradient(180deg,#43e08a,#2ECC71);color:#06260f}button.b.gh{background:var(--bg);color:#fff;border:1px solid var(--bd)}
button.b.sm{padding:7px 10px;min-height:34px;font-size:12px}.w{width:100%}
.back{background:none;border:0;color:var(--cy);font:700 14px Inter,sans-serif;padding:4px 0 10px;cursor:pointer}
.bet{display:flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--bd);border-radius:11px;padding:4px 6px 4px 10px;margin:8px 0}
.bet input{flex:1;min-width:0;background:none;border:0;color:#fff;font:700 16px Inter,sans-serif;outline:0;padding:6px 0}
.bet button{background:var(--card);border:1px solid var(--bd);color:var(--mut);border-radius:8px;padding:7px 9px;font:700 12px Inter;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{background:var(--bg);border:1px solid var(--bd);color:var(--mut);border-radius:20px;padding:8px 14px;font:700 13px Inter;cursor:pointer;min-height:38px}.chip.on{border-color:var(--cy);color:#fff;background:#1b4660}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.mg{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.t{aspect-ratio:1;border-radius:10px;border:1px solid var(--bd);background:linear-gradient(160deg,#2b4a61,#21384A);font-size:24px;cursor:pointer;display:grid;place-items:center;transition:transform .12s,background .2s;color:#fff}
.t:hover:not(:disabled){transform:scale(1.05);border-color:var(--cy)}.t.ok{background:#1e5a3c;border-color:var(--g);animation:pop .3s}.t.bad{background:#6a2a2a;border-color:var(--r)}.t.dim{opacity:.5}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
.sg{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;user-select:none;touch-action:manipulation}
.sg .t{font-size:13px;font-weight:800;border-radius:6px;aspect-ratio:1}.sg .t.ok{background:#1a2f3f;border-color:#2D4A60;animation:none}
.mult{font-size:26px;font-weight:800;color:var(--g);text-align:center;margin:4px 0}
canvas{width:100%;display:block;background:#142533;border-radius:12px;border:1px solid var(--bd)}
.wheel{position:relative;width:190px;margin:8px auto}.wheel .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:30px;font-weight:800}.wheel .c small{display:block;font-size:11px;color:var(--mut);font-weight:500}
.sc{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.gc{min-width:92px;background:var(--bg);border:2px solid var(--bd);border-radius:12px;padding:8px;text-align:center;cursor:pointer;font-size:11px;transition:border-color .2s}.gc.on{border-color:var(--cy)}.gc i{font-style:normal;display:block;font-size:30px}
.rw{position:relative;overflow:hidden;background:#142533;border:1px solid var(--bd);border-radius:12px;height:112px;margin:10px 0}
.rw:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:var(--gold);box-shadow:0 0 12px var(--gold);transform:translateX(-50%);z-index:2}
.rt{display:flex;height:100%;align-items:center;will-change:transform}
.ri{flex:none;width:90px;height:90px;margin:0 3px;border-radius:10px;border:2px solid;background:var(--card);display:grid;place-items:center;text-align:center;font-size:30px;line-height:1.1}.ri b{font-size:12px;display:block}
.badge{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:8px;background:#0003}
#mo{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:20;padding:16px}#mo.on{display:grid}
#mo .box{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;width:100%;max-width:400px;animation:pop .25s;text-align:center}
#tw{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:0;right:0;display:grid;gap:6px;justify-items:center;z-index:50;pointer-events:none}
.toast{background:#0f1d28;border:1px solid var(--bd);border-left:4px solid var(--cy);padding:9px 14px;border-radius:10px;font-weight:700;animation:pop .25s;max-width:92%}.toast.g{border-left-color:var(--g)}.toast.r{border-left-color:var(--r)}
.inp{width:100%;background:var(--bg);border:1px solid var(--bd);color:#fff;border-radius:10px;padding:12px;font:600 15px Inter;margin:6px 0;outline:0}
.big{font-size:28px;font-weight:800}
#reg{position:fixed;inset:0;z-index:40;display:none;place-items:center;padding:16px;background:rgba(11,20,28,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}#reg.on{display:grid}
.glass{width:100%;max-width:400px;text-align:center;padding:26px 22px;border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.24);box-shadow:0 20px 60px #0008;animation:pop .3s}
.card.free{background:linear-gradient(135deg,#2f5673,#21384A);border-color:var(--gold);box-shadow:0 0 20px #FFB80033;cursor:pointer}.g{color:var(--g)}.r{color:var(--r)}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE082"/><stop offset=".45" stop-color="#FFD54F"/><stop offset="1" stop-color="#FF8F00"/></linearGradient>
<symbol id="s" viewBox="0 0 24 24"><path d="M12 1.8l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.6 5.7 21.2l1.5-7.1L1.8 9.2l7.2-.8z" fill="url(#sg)" stroke="#E65100" stroke-width=".7" stroke-linejoin="round"/><path d="M12 1.8L9 8.4l-7.2.8 5.4 4.9-1.5 7.1L12 17.6z" fill="#fff" opacity=".24"/><path d="M12 4.6l1.5 3.4-2.9.3z" fill="#fff" opacity=".7"/></symbol></defs></svg>
<div id="app">
<header><div class="av" id="ha">T</div><div class="un"><span id="hn">@telegram_user</span><small>Star Arcade</small></div><div class="pill"><svg class="st" viewBox="0 0 24 24"><use href="#s"/></svg><span id="bal">1,000</span></div></header>
<main id="v"></main>
<nav id="nv"></nav></div>
<div id="mo"></div><div id="tw"></div><div id="ton-hold" style="display:none"></div>
<div id="reg"><div class="glass"><svg class="st" style="width:72px;height:72px" viewBox="0 0 24 24"><use href="#s"/></svg><h2 style="margin-top:10px">Welcome to Star Arcade</h2><p class="mut" style="margin-bottom:16px">Sign in to claim 20 free Telegram Stars and start playing right away.</p><button class="b cy w" onclick="regGo('@telegram_user')">✈️ Continue with Telegram</button><div class="mut" style="margin:12px 0 2px">or pick a username</div><input class="inp" id="ru" placeholder="@username" autocomplete="off" autocapitalize="off"><button class="b w" onclick="regGo()">Claim 20 Stars &amp; Start</button></div></div>
<script>
const $=s=>document.querySelector(s);
const S=(c='')=>`<svg class="st ${c}" viewBox="0 0 24 24"><use href="#s"/></svg>`;
const fmt=n=>(Math.round(n*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
const rnd=n=>Math.floor(Math.random()*n);
const GL={bear:{n:'Plush Bear',e:'🧸',v:50,r:'Common'},cig:{n:'Vintage Cigar',e:'🚬',v:150,r:'Rare'},watch:{n:'Swiss Watch',e:'⌚',v:500,r:'Rare'},cap:{n:'Durov’s Cap',e:'🧢',v:1200,r:'Epic'},trophy:{n:'Star Trophy',e:'🏆',v:2500,r:'Epic'},pepe:{n:'Plush Pepe',e:'🐸',v:5000,r:'Legendary'}};
const RC={Common:'#8FA8BC',Rare:'#2AABEE',Epic:'#B26BFF',Legendary:'#FFB800'};
let ST0={};try{ST0=JSON.parse(localStorage.getItem('sa_v1'))||{}}catch(e){}
let user=ST0.user||'',bal=ST0.bal??20,shown=bal,bt=0,gifts=ST0.gifts||[],uid=ST0.uid||1,freeAt=ST0.freeAt||0,wallet=ST0.wallet||null,tgUser=ST0.tgUser||null,tab='games',cur=null;
function save(){try{localStorage.setItem('sa_v1',JSON.stringify({user,bal,gifts,uid,freeAt,wallet,tgUser}))}catch(e){}}
function applyUser(){$('#hn').textContent=user||'@telegram_user';$('#ha').innerHTML=avc();$('#bal').textContent=fmt(bal)}
function regGo(u){u=(u||$('#ru').value).trim();if(u&&u[0]!=='@')u='@'+u;if(!/^@[A-Za-z][A-Za-z0-9_]{4,31}$/.test(u))return toast('Username needs 5–32 letters, digits or _','r');user=u;bal=20;shown=20;save();$('#reg').className='';applyUser();render();toast('Welcome! 20 Stars added','g')}
// ---- Telegram Mini App init (falls back to Demo Mode in a normal browser) ----
const tg=window.Telegram?.WebApp,inTG=!!(tg&&tg.initDataUnsafe?.user);
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const ini=()=>((user||'T').replace('@','')[0]||'T').toUpperCase();
function avc(){return tgUser&&tgUser.photo_url?`<img src="${esc(tgUser.photo_url)}" alt="" referrerpolicy="no-referrer" style="width:100%;height:100%;object-fit:cover" onerror="this.replaceWith(ini())">`:ini()}
if(inTG){try{tg.ready();tg.expand();tg.setHeaderColor('#182B39');tg.setBackgroundColor('#182B39')}catch(e){}
// TODO: Send tg.initData to backend /api/auth for HMAC-SHA256 signature verification
const u=tg.initDataUnsafe.user;tgUser={id:u.id,first_name:u.first_name||'',username:u.username||'',photo_url:u.photo_url||''};
if(!user){bal=20;shown=20}user=u.username?'@'+u.username:(u.first_name||'User'+u.id);save()}
applyUser();if(!user)$('#reg').className='on';
// ---- TON Connect (real SDK, simulated modal fallback) ----
const MANIFEST=window.location.origin+'/tonconnect-manifest.json';
let tonNode=null,tonState='pending',tcui=null;
function tonSim(){tonState='sim';tcui=null;if(tab==='profile')rProf()}
function initTON(){try{fetch(MANIFEST).then(r=>{if(!r.ok)throw new Error('manifest not hosted');return r.json()}).then(()=>{const NS=window.TON_CONNECT_UI;if(!NS)throw new Error('SDK not loaded');
tcui=new NS.TonConnectUI({manifestUrl:MANIFEST,buttonRootId:'ton-connect-btn'});tonState='real';
tcui.onStatusChange(w=>{if(w&&w.account){const raw=w.account.address;let fa=raw;try{fa=NS.toUserFriendlyAddress(raw,w.account.chain==='-3')}catch(e){}
wallet={name:String(w.device&&w.device.appName||'TON Wallet').replace(/[^\w .-]/g,''),addr:fa.slice(0,4)+'...'+fa.slice(-4),full:fa,raw,real:1}}else if(wallet&&wallet.real)wallet=null;
save();if(tab==='profile')rProf()});if(tab==='profile')rProf()}).catch(tonSim)}catch(e){tonSim()}}
function mountTON(){const s=$('#ton-slot');if(!s||tonState==='sim')return;if(!tonNode){tonNode=document.createElement('div');tonNode.id='ton-connect-btn';s.appendChild(tonNode);initTON()}else s.appendChild(tonNode)}
function walletUI2(){const show=tonState==='real'&&!wallet;return `<div id="ton-slot" style="${show?'margin-bottom:12px;display:flex;justify-content:center':'display:none'}"></div>`+(show?'':walletUI())}
const rProf0=rProf;rProf=function(){if(tonNode)$('#ton-hold').appendChild(tonNode);rProf0();mountTON()};
// ---- Telegram Stars (XTR) top-up ----
function creditStars(n){setBal(n);toast(`+${fmt(n)} Stars added`,'g');if(tab==='profile')rProf()}
function buyStars(n){if(tg&&tg.openInvoice){
// TODO: Fetch invoiceLink from backend (Bot API createInvoiceLink with currency: 'XTR')
// const invoiceUrl=(await (await fetch('/api/create-invoice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:n,initData:tg.initData})})).json()).invoiceLink;
const invoiceUrl=null;
if(invoiceUrl){tg.openInvoice(invoiceUrl,status=>{if(status==='paid'){creditStars(n);closeM()}else toast('Payment '+status,'r')});return}
return toast('Invoice backend not set up yet. Use the demo top-up below','r')}
toast('Real Star payments work inside Telegram. Use the demo top-up below','r')}
topM=function(){const PK=[100,500,1000,5000],row=f=>`<div class="grid2">${PK.map(n=>`<button class="b ${f==='b'?'cy':''}" onclick="${f==='b'?'buyStars':'creditStars'}(${n});${f==='b'?'':'closeM()'}">${S()} ${n.toLocaleString('en-US')}</button>`).join('')}</div>`;
modal(`<h2>Top up Stars</h2><div class="mut" style="margin-bottom:6px">Buy with Telegram Stars (XTR)</div>${row('b')}<div class="mut" style="margin:14px 0 6px">Demo top-up (local testing)</div>${row('d')}<button class="b gh w" style="margin-top:12px" onclick="closeM()">Close</button>`)};
const WI='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-3"/><path d="M21 9h-5a2 2 0 0 0 0 5h5z"/></svg>';
function walletUI(){return wallet?`<div class="card row" style="border-color:#2ECC71"><div><span class="badge" style="background:#2ECC7133;color:#2ECC71">● Connected</span><div style="font-weight:700;margin-top:4px">${wallet.name}</div><div class="mut">${wallet.addr}</div></div><button class="b gh sm" onclick="wDisc()">Disconnect</button></div>`:`<button class="b w" style="background:#0098EA;color:#fff;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:8px" onclick="walM()">${WI}Connect Telegram Wallet</button>`}
function walM(){modal(`<h2>Connect a wallet</h2>${[['Telegram Wallet','👛'],['Tonkeeper','💎'],['MyTonWallet','🔷']].map(w=>`<button class="b gh w" style="margin-bottom:8px" onclick="walGo('${w[0]}')">${w[1]} ${w[0]}</button>`).join('')}<button class="b gh w" onclick="closeM()">Cancel</button>`)}
function walGo(n){modal(`<div class="big">Connecting…</div><p class="mut">Approve the request in ${n}</p>`,1);setTimeout(()=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz0123456789',r=k=>[...Array(k)].map(()=>c[rnd(c.length)]).join('');wallet={name:n,addr:'UQ'+r(2)+'...'+r(4)};save();closeM();toast(`${n} connected`,'g');if(tab==='profile')rProf()},900)}
function wDisc(){const r=wallet&&wallet.real;wallet=null;save();if(r&&tcui)try{tcui.disconnect()}catch(e){}toast('Wallet disconnected');rProf()}
function setBal(d){bal=+(bal+d).toFixed(2);save();const id=++bt,f=shown,t0=performance.now();(function s(n){if(id!==bt)return;const k=Math.min(1,(n-t0)/500);shown=f+(bal-f)*k;$('#bal').textContent=fmt(shown);if(k<1)requestAnimationFrame(s)})(t0)}
function toast(m,c=''){const e=document.createElement('div');e.className='toast '+c;e.innerHTML=m;$('#tw').appendChild(e);setTimeout(()=>e.remove(),2600)}
function modal(h,lock){const m=$('#mo');m.innerHTML=`<div class="box">${h}</div>`;m.className='on';m.onclick=lock?null:e=>{if(e.target===m)closeM()}}
function closeM(){$('#mo').className='';save()}
function popup(win,title,amt,sub=''){modal(`<div style="font-size:44px">${win?'🎉':'💥'}</div><h2 class="${win?'g':'r'}">${title}</h2><div class="big">${win?'+':'−'}${fmt(amt)} ${S()}</div><p class="mut" style="margin:6px 0 14px">${sub}</p><button class="b w" onclick="closeM()">Continue</button>`)}
function bet(id,v=10){return `<div class="bet">${S()}<input id="${id}" type="number" inputmode="decimal" min="1" value="${v}"><button onclick="hb('${id}',.5)">½</button><button onclick="hb('${id}',2)">2×</button><button onclick="hb('${id}',0)">Max</button></div>`}
function hb(id,k){const e=$('#'+id);e.value=k?Math.max(1,Math.floor(e.value*k)):Math.floor(bal)}
function getBet(id){const v=+$('#'+id).value;if(!(v>=1)){toast('Enter a bet of at least 1 Star','r');return 0}if(v>bal){toast('Not enough Stars. Top up in Profile','r');return 0}return v}
function gcard(id,on,click){const g=GL[id];return `<div class="gc ${on?'on':''}" onclick="${click}"><i>${g.e}</i>${g.n}<br><span class="mut">${g.v} ★</span></div>`}
// NAV
const TABS=[['games','🎮','Games'],['cases','📦','Cases'],['stake','🏦','Staking'],['profile','👤','Profile']];
function go(t){tab=t;cur=null;cs=null;render()}
function render(){save();if(tonNode)$('#ton-hold').appendChild(tonNode);$('#nv').innerHTML=TABS.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('');
const v=$('#v');v.scrollTop=0;
({games:()=>cur?GAMES[cur]():lobby(),cases:rCases,stake:rStake,profile:rProf})[tab]();fTick()}
function lobby(){$('#v').innerHTML=`<h2>Games</h2><div class="grid2">${[['mines','💣','Mines','Up to 10,000× grid'],['plinko','🔮','Plinko','Drop and win'],['sweep','🚩','Minesweeper','Clear for jackpot'],['up','⚡','Gift Upgrader','Trade up a tier']].map(g=>`<div class="card lob" onclick="cur='${g[0]}';render()"><b>${g[1]}</b>${g[2]}<br><small>${g[3]}</small></div>`).join('')}</div>`}
const BK=`<button class="back" onclick="cur=null;render()">‹ Back to Games</button>`;
// MINES
let M={on:0,mines:new Set(),rev:new Set(),bet:1,mc:3};
const mM=(k,m)=>{let r=1;for(let i=0;i<k;i++)r*=(25-i)/(25-m-i);return r*.97};
function rMines(){const k=M.rev.size,mu=M.on?mM(k,M.mc):1,ended=!M.on&&M.mines.size;
$('#v').innerHTML=BK+`<h2>Mines</h2><div class="card"><div class="mg">${[...Array(25)].map((_,i)=>{const o=M.rev.has(i),m=M.mines.has(i);return `<button class="t ${o?'ok':''} ${ended&&m?(M.hit===i?'bad':'dim'):''}" ${!M.on||o?'disabled':''} onclick="mClick(${i})">${o?S():(ended&&m?'💣':'')}</button>`}).join('')}</div></div>
<div class="card"><div class="mult">${M.on?mu.toFixed(2)+'×':'—'}</div>
${M.on?`<button class="b gr w" onclick="mCash()">Cash out ${fmt(M.bet*mu)} ${S()}</button>`:`<span class="mut">Bet</span>${bet('mb',M.bet)}<span class="mut">Mines</span><div class="chips">${[3,5,10,20].map(n=>`<button class="chip ${n===M.mc?'on':''}" onclick="M.mc=${n};M.bet=+$('#mb').value||10;rMines()">${n}</button>`).join('')}</div><button class="b w" onclick="mStart()">Bet</button>`}</div>`}

let P={risk:'med',balls:[],raf:0,fl:{}};const SP=34,CX=200,PY=r=>36+r*SP;
function rPlinko(){$('#v').innerHTML=BK+`<h2>Plinko</h2><canvas id="pc" width="400" height="420"></canvas><div class="card" style="margin-top:12px">${bet('pb',1)}<div class="chips">${['low','med','high'].map(r=>`<button class="chip ${r===P.risk?'on':''}" onclick="P.risk='${r}';rPlinko()">${r==='med'?'Medium':r[0].toUpperCase()+r.slice(1)} risk</button>`).join('')}</div><button class="b w" onclick="drop()">Drop ball</button></div>`;pDraw()}
function drop(){const b=getBet('pb');if(!b)return;setBal(-b);P.balls.push({x:CX+Math.random()*6-3,y:8,vx:0,vy:0,b,m:PM[P.risk]});if(!P.raf)P.raf=requestAnimationFrame(pLoop)}
function pLoop(){for(let s=0;s<3;s++)for(let i=P.balls.length-1;i>=0;i--){const o=P.balls[i];o.vy=Math.min(o.vy+.1,7);o.vx*=.998;o.x+=o.vx;o.y+=o.vy;
if(o.x<10||o.x>390){o.x=Math.max(10,Math.min(390,o.x));o.vx*=-.5}
if(o.y<PY(9)+14)for(let r=0;r<10;r++){if(Math.abs(o.y-PY(r))>12)continue;for(let j=0;j<r+3;j++){const px=CX+(j-(r+2)/2)*SP,dx=o.x-px,dy=o.y-PY(r),d=Math.hypot(dx,dy);if(d<9&&d>0){const nx=dx/d,ny=dy/d,dt=o.vx*nx+o.vy*ny;o.x=px+nx*9;o.y=PY(r)+ny*9;if(dt<0){o.vx-=1.55*dt*nx;o.vy-=1.55*dt*ny}o.vx+=(Math.random()-.5)*.35}}}
if(o.y>PY(9)+34){const k=Math.max(0,Math.min(10,Math.floor((o.x-(CX-5.5*SP))/SP))),m=o.m[k],w=+(o.b*m).toFixed(2);P.balls.splice(i,1);P.fl[k]=1;setBal(w);toast(`${m}× · ${w>=o.b?'+':''}${fmt(w-o.b)} ★`,w>=o.b?'g':'r')}}
for(const k in P.fl){P.fl[k]-=.02;if(P.fl[k]<=0)delete P.fl[k]}
pDraw();P.raf=(P.balls.length||Object.keys(P.fl).length)?requestAnimationFrame(pLoop):0}
function pDraw(){const c=$('#pc');if(!c)return;const x=c.getContext('2d');x.clearRect(0,0,400,420);x.fillStyle='#8FA8BC';
for(let r=0;r<10;r++)for(let j=0;j<r+3;j++){x.beginPath();x.arc(CX+(j-(r+2)/2)*SP,PY(r),3.2,0,7);x.fill()}
const m=PM[P.risk],by=PY(9)+36;x.textAlign='center';x.font='700 11px Inter,sans-serif';
m.forEach((v,k)=>{const bx=CX+(k-5)*SP,col=v>=2?'#FFB800':v>=1?'#2AABEE':'#E74C3C';x.globalAlpha=.25+(P.fl[k]||0);x.fillStyle=col;x.beginPath();x.roundRect(bx-16,by,32,30,6);x.fill();x.globalAlpha=1;x.fillStyle='#fff';x.fillText(v+'×',bx,by+19)});
P.balls.forEach(o=>{x.shadowColor='#FFD700';x.shadowBlur=14;x.fillStyle='#FFD700';x.beginPath();x.arc(o.x,o.y,6,0,7);x.fill();x.shadowBlur=0})}
// MINESWEEPER
const SD={easy:[8,3],med:[12,5],hard:[16,8]};let W={on:0,bet:1,d:'easy',fm:0,lp:0};
const nb=i=>{const r=i>>3,c=i&7,a=[];for(let y=-1;y<2;y++)for(let x=-1;x<2;x++){const R=r+y,C=c+x;if((x||y)&&R>=0&&R<8&&C>=0&&C<8)a.push(R*8+C)}return a};
const wMult=()=>{const[m,mx]=SD[W.d],sf=64-m,k=W.rev.size/sf;let u=1+Math.pow(k,1.5)*(mx-1);return W.rev.size===sf?u*1.5:u};
function rSweep(){const mu=W.on?wMult():1,NC=['','#2AABEE','#2ECC71','#E74C3C','#B26BFF','#FFB800','#2AABEE','#fff','#fff'];
$('#v').innerHTML=BK+`<h2>Minesweeper</h2><div class="card"><div class="mult">${W.on?mu.toFixed(2)+'×':'—'}</div><div class="sg" oncontextmenu="return false">${[...Array(64)].map((_,i)=>{if(!W.on&&!W.g)return `<button class="t" disabled></button>`;const o=W.rev&&W.rev.has(i),f=W.fl&&W.fl.has(i),sh=!W.on&&W.g&&W.g[i].m;
return `<button class="t ${o?'ok':''} ${sh?'bad':''}" ${W.on?'':'disabled'} onpointerdown="wDown(${i})" onpointerup="clearTimeout(W.tm)" onpointerleave="clearTimeout(W.tm)" onclick="wClick(${i})" style="${o?'color:'+NC[W.g[i].n]:''}">${o?(W.g[i].n||''):f?'🚩':sh?'💣':''}</button>`}).join('')}</div></div>
<div class="card">${W.on?`<div class="row"><button class="chip ${W.fm?'on':''}" onclick="W.fm=!W.fm;rSweep()">🚩 Flag mode</button><span class="mut">Long-press also flags</span></div><button class="b gr w" style="margin-top:10px" ${W.rev.size?'':'disabled'} onclick="wCash()">Cash out ${fmt(W.bet*mu)} ${S()}</button>`:`${bet('wb',W.bet)}<div class="chips">${Object.keys(SD).map(d=>`<button class="chip ${d===W.d?'on':''}" onclick="W.bet=+$('#wb').value||10;W.d='${d}';rSweep()">${d==='med'?'Medium':d[0].toUpperCase()+d.slice(1)} · ${SD[d][0]} mines</button>`).join('')}</div><button class="b w" onclick="wStart()">Start</button>`}</div>`}
function wStart(){const b=getBet('wb');if(!b)return;W.bet=b;setBal(-b);W.on=1;W.g=null;W.rev=new Set();W.fl=new Set();rSweep()}
function wGen(s){const g=[...Array(64)].map(()=>({m:0,n:0})),ban=new Set([s,...nb(s)]);let k=0;while(k<SD[W.d][0]){const i=rnd(64);if(!g[i].m&&!ban.has(i)){g[i].m=1;k++}}g.forEach((c,i)=>c.n=nb(i).filter(j=>g[j].m).length);W.g=g}
function wDown(i){clearTimeout(W.tm);W.lp=0;W.tm=setTimeout(()=>{W.lp=1;wFlag(i)},420)}
function wFlag(i){if(!W.g||W.rev.has(i))return;W.fl.has(i)?W.fl.delete(i):W.fl.add(i);rSweep()}
function wClick(i){if(W.lp){W.lp=0;return}if(!W.on)return;if(W.fm)return wFlag(i);if(W.fl.has(i))return;if(!W.g)wGen(i);
if(W.g[i].m){W.on=0;rSweep();return popup(0,'Boom',W.bet,'You hit a mine.')}
const q=[i];while(q.length){const c=q.pop();if(W.rev.has(c)||W.fl.has(c))continue;W.rev.add(c);if(!W.g[c].n)nb(c).forEach(j=>!W.g[j].m&&q.push(j))}
if(W.rev.size===64-SD[W.d][0])return wCash(1);rSweep()}
function wCash(j){const mu=wMult(),w=+(W.bet*mu).toFixed(2);W.on=0;setBal(w);rSweep();popup(1,j?'Jackpot, board cleared':'Cashed out',w,`${mu.toFixed(2)}× multiplier`)}
